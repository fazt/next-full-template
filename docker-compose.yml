# Base de datos para desarrollo local.
# Levantar: docker compose up -d
services:
  db:
    image: postgres:latest
    container_name: next-full-template-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fazt
      POSTGRES_PASSWORD: faztpassword
      POSTGRES_DB: nextdb
    ports:
      - "5461:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fazt -d nextdb"]
      interval: 5s
      timeout: 5s
      retries: 10
